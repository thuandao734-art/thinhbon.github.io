<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Thịnh Bon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: sticky top bar, three views (trang chủ, danh sách, chi tiết) switched by hash. Deep green + persimmon, room drawings are generated in code. */
:root{
  --bg:#F5F6F1; --surface:#FFFFFF; --ink:#13302B; --muted:#576B66; --line:#DCE3DB;
  --accent:#C8441B; --accent-ink:#FFFFFF; --deep:#13302B; --deep-ink:#F5F6F1; --soft:#E7EFE5; --good:#1F7A52; --warn:#9A5B00; --warn-bg:#FBEBCB;
  --font-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1C19; --surface:#152723; --ink:#EAF0EA; --muted:#9DB1AB; --line:#2A3F3A;
    --accent:#FF7A50; --accent-ink:#1A0D08; --deep:#0A1513; --deep-ink:#EAF0EA; --soft:#1B3430; --good:#5FD0A0; --warn:#F2C26B; --warn-bg:#3A2D12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1C19; --surface:#152723; --ink:#EAF0EA; --muted:#9DB1AB; --line:#2A3F3A;
  --accent:#FF7A50; --accent-ink:#1A0D08; --deep:#0A1513; --deep-ink:#EAF0EA; --soft:#1B3430; --good:#5FD0A0; --warn:#F2C26B; --warn-bg:#3A2D12;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) ;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.brand svg{width:30px;height:30px;flex:none}
.brand b{color:var(--accent);font-weight:800}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav a,nav button{background:none;border:0;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:600;display:inline-flex;gap:8px;align-items:center}
nav a:hover,nav button:hover,nav [aria-current="page"]{background:var(--soft)}
.count{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:.75rem;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 6px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:99px;font-weight:700;text-decoration:none}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.block{width:100%;border-radius:12px}
.btn:hover{filter:brightness(1.08)}
/* hero */
.hero{position:relative;padding-block:40px 48px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:96px;align-items:center;overflow:hidden;min-height:620px}
.eyebrow{font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:.78rem}
.hero h1{font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.04;font-weight:800;margin-block:14px 22px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{color:var(--muted);font-size:1.15rem;line-height:1.7;max-width:46ch}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.pill{display:inline-flex;align-items:stretch;border:0;padding:0;border-radius:99px;overflow:hidden;font-weight:700;font-size:1.1rem;text-decoration:none;background:var(--accent);color:var(--accent-ink)}
.pill.dark{background:var(--deep);color:var(--deep-ink)}
.pill span{padding:18px 8px 18px 34px;display:flex;align-items:center}
.pill i{display:grid;place-items:center;margin-left:14px;padding:0 26px 0 34px;background:rgba(255,255,255,.2);clip-path:polygon(18px 0,100% 0,100% 100%,0 100%)}
.pill:hover{filter:brightness(1.08)}
.swoosh{position:absolute;left:calc(52.5% - 48px);top:30%;width:70px;height:190px;pointer-events:none}
.collage{display:grid;grid-template-columns:1.25fr 1fr .8fr;grid-auto-rows:92px;gap:14px;margin-right:-70px;align-self:center}
.collage .ph{border-radius:12px}
.collage .t1{grid-column:1/3;grid-row:1/3}
.collage .t2{grid-column:3;grid-row:1/3}
.collage .t3{grid-column:1;grid-row:3/6}
.collage .t4{grid-column:2/4;grid-row:3/5}
.collage .t5{grid-column:2;grid-row:5/7}
.collage .t6{grid-column:3;grid-row:5/7}
.collage .t7{grid-column:1;grid-row:6/8}
.ph{border-radius:14px;overflow:hidden;background:var(--soft);min-width:0}
.ph svg{display:block;width:100%;height:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-block:1px solid var(--line);margin-bottom:56px}
.stats div{padding:20px 18px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--font-display);font-size:1.9rem;font-weight:800}
.stats span{color:var(--muted);font-size:.9rem}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px;margin-bottom:56px}
.how h3{font-size:1.2rem;margin-bottom:6px}
.how p{color:var(--muted)}
.how svg{width:34px;height:34px;color:var(--accent);margin-bottom:10px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{font-size:1.7rem}
/* listing page */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-block:20px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.field.grow{flex:1 1 260px}
select.field{padding-right:8px}
.field:focus-within{border-color:var(--accent)}
.search{width:100%;border:0;background:none;outline:0}
.chip-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}
.chip-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.result-line{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;position:relative}
.card .ph{border-radius:0;aspect-ratio:4/3;position:relative}
.card a.cover{display:block;text-decoration:none}
.tags{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.tag{font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:7px;background:var(--surface);color:var(--ink)}
.tag.new{background:var(--good);color:#fff}
.tag.last{background:var(--accent);color:var(--accent-ink)}
.tag.soon{background:var(--warn-bg);color:var(--warn)}
.fav{position:absolute;right:10px;top:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.fav svg{width:20px;height:20px}
.fav[aria-pressed="true"]{color:var(--accent)}
.fav[aria-pressed="true"] svg path{fill:currentColor}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-family:var(--font-display);font-size:1.4rem;font-weight:800;color:var(--accent)}
.price s{color:var(--muted);font-size:.85rem}
.off{background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 8px}
.card h3{font-size:1rem;font-weight:700;font-family:var(--font-body);line-height:1.35}
.card h3 a{text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:.88rem}
.empty{border:1px dashed var(--line);border-radius:16px;padding:48px 20px;text-align:center;color:var(--muted)}
/* detail */
.back{display:inline-flex;align-items:center;gap:8px;margin-block:18px;font-weight:600;text-decoration:none}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;padding-bottom:56px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;min-width:0}
.panel h2{font-size:1.25rem;margin-bottom:14px}
.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:150px 150px;gap:8px;margin-bottom:18px}
.gallery .ph:first-child{grid-row:span 2}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.badges .tag{position:static;background:var(--soft)}
.badges .tag.soon{background:var(--warn-bg)}
.detail h1{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:800;margin-bottom:6px}
.sub{color:var(--muted)}
.meeting{background:var(--soft);border-radius:12px;padding:14px 16px;margin-block:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.meeting small{color:var(--good);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.72rem;display:block}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:1px solid var(--line);margin-top:16px}
.facts div{padding:16px 14px 0 0}
.facts b{font-family:var(--font-display);font-size:1.5rem;display:block}
.facts span{color:var(--muted);font-size:.88rem}
dl.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px;margin:0}
dl.rows div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
dl.rows dt{color:var(--muted)}
dl.rows dd{margin:0;font-weight:700;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{display:inline-flex;gap:8px;align-items:center;background:var(--soft);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.92rem}
.chips svg{width:16px;height:16px;color:var(--good)}
aside.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.side .big{font-family:var(--font-display);font-size:2rem;font-weight:800;color:var(--accent)}
.side .actions{display:grid;gap:10px;margin-block:16px}
.contact{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.contact .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.contact .row span{color:var(--muted)}
.copy{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:.82rem;font-weight:600}
form.book{display:grid;gap:10px;margin-top:12px}
form.book label{font-size:.82rem;font-weight:600;color:var(--muted);display:grid;gap:4px}
form.book input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.note{font-size:.85rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px;margin-left:8px;vertical-align:middle}
.seg button{border:0;background:none;border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.near{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}
.near h3{font-size:1.1rem;margin-bottom:6px}
.near ul,.sib{list-style:none;margin:0;padding:0}
.near li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.near li span{color:var(--muted);white-space:nowrap}
.sib li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.sib li:last-child{border-bottom:0}
.sib .cur{font-weight:700}
.st{display:inline-block;font-size:.75rem;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--soft);color:var(--muted)}
.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.ok{background:var(--soft);color:var(--good)}
.tag-soft{font-size:.75rem;font-weight:600;background:var(--soft);color:var(--muted);border-radius:99px;padding:3px 10px;margin-left:8px;vertical-align:middle}
@media (max-width:560px){.near{grid-template-columns:minmax(0,1fr)}}
.ok{background:var(--soft);border-radius:10px;padding:12px;font-weight:600}
footer{border-top:1px solid var(--line);margin-top:24px;padding-block:28px 36px;color:var(--muted);font-size:.88rem;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr);padding-block:28px;gap:32px;min-height:0}
  .swoosh{display:none}
  .collage{margin-right:0}
  .detail{grid-template-columns:minmax(0,1fr)}
  aside.side{position:static}
}
@media (max-width:560px){
  dl.rows{grid-template-columns:minmax(0,1fr)}
  .collage{grid-auto-rows:62px;gap:10px}
  .pill{font-size:1rem}
  .pill span{padding-left:26px}
  .gallery{grid-template-rows:110px 110px}
  nav{margin-left:0;width:100%}
  .stats div{border-right:0;border-bottom:1px solid var(--line)}
}
/* polish */
.bar{box-shadow:0 10px 24px -22px rgba(19,48,43,.55)}
nav [aria-current="page"]{background:var(--ink);color:var(--bg)}
nav a,nav button{transition:background .15s ease}
.hero{isolation:isolate}
.hero::before{content:"";position:absolute;right:-14%;top:-18%;width:68%;height:140%;background:radial-gradient(closest-side,var(--soft),transparent);z-index:-1}
.hero h1{font-size:clamp(2.6rem,6.4vw,5rem);line-height:1.02;letter-spacing:-.035em;font-style:italic;font-weight:800;text-shadow:0 12px 30px color-mix(in srgb,var(--ink) 14%,transparent)}
.hero h1 em{font-style:italic;background:linear-gradient(95deg,var(--accent) 10%,#F2A03D 90%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-right:.06em;text-shadow:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.collage .ph{box-shadow:0 14px 28px -16px rgba(19,48,43,.55)}
.pill{transition:transform .15s ease,filter .15s ease;box-shadow:0 10px 20px -12px rgba(19,48,43,.6)}
.pill:hover{transform:translateY(-2px)}
.btn{transition:transform .15s ease,filter .15s ease}
.btn:hover{transform:translateY(-1px)}
.stats{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.stats b{color:var(--accent);font-size:2.1rem}
.how>div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.how svg{width:40px;height:40px;padding:8px;background:var(--soft);border-radius:12px}
.sec-head h2{font-size:2rem}
.card{border-radius:18px;transition:transform .2s ease,box-shadow .2s ease;box-shadow:0 1px 2px rgba(19,48,43,.06)}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 34px -16px rgba(19,48,43,.35)}
.card .ph svg{transition:transform .5s ease}
.card:hover .ph svg{transform:scale(1.05)}
.card .body{padding:16px 18px 18px;gap:8px}
.price b{font-size:1.5rem}
.fav{transition:transform .15s ease;box-shadow:0 4px 10px -4px rgba(0,0,0,.35)}
.fav:hover{transform:scale(1.1)}
.tag{box-shadow:0 2px 6px -2px rgba(0,0,0,.3)}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;margin-block:18px}
.filters .field,.filters .chip-btn{background:var(--bg);border-color:transparent}
.filters .chip-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.panel{border-radius:18px;box-shadow:0 1px 2px rgba(19,48,43,.04),0 14px 28px -22px rgba(19,48,43,.3)}
.gallery .ph{border-radius:16px;box-shadow:0 12px 24px -18px rgba(19,48,43,.5)}
.detail h1{letter-spacing:-.02em}
.band{background:var(--deep);color:var(--deep-ink);border-radius:26px;padding:40px;margin-block:56px 28px;display:flex;gap:24px;justify-content:space-between;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:var(--accent);opacity:.18}
.band h2{font-size:clamp(1.6rem,3.2vw,2.3rem);max-width:20ch;position:relative}
.band p{opacity:.78;margin-top:10px;max-width:46ch;position:relative}
.band .pill{position:relative;box-shadow:none}
footer{margin-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.card:hover,.pill:hover,.btn:hover{transform:none}}
</style>

    var off=d.old?Math.round((1-d.price/d.old)*100):0;
    var rows=[['Không gian thuê','Phòng riêng'],['Số lượng giường',d.beds],['Loại phòng',d.type],['Gác xép',d.loft],['Số nhà vệ sinh',d.wc],['Bếp ngăn riêng',d.kitchen],['Số người ở',d.people],['Vị trí trong tòa',d.pos],['Chỗ để xe',d.park],['Vị trí phơi đồ',d.dry],['Lấy thoáng',d.air],['Vị trí giặt sấy chung','Sân thượng'],['View cửa sổ',d.view],['Mục đích','Để ở']];
    var svc=[['Điện',fmt(d.elec)+'/số'],['Internet',fmt(d.net)+'/phòng'],['Nước',fmt(d.water)+'/khối'],['Xe điện cá nhân',fmt(d.bike)+'/xe'],['Dịch vụ chung',fmt(d.svc)+'/người'],['Xe điện dịch vụ',fmt(d.bike)+'/xe']];
    var rules=[['Thú cưng',d.pets],['Xe điện',d.ev],['Khách quốc tế',d.intl],['Giờ giấc',d.hours]];
    function dl(a){return '<dl class="rows">'+a.map(function(r){return '<div><dt>'+r[0]+'</dt><dd>'+r[1]+'</dd></div>'}).join('')+'</dl>'}
    var today=new Date(); today.setMinutes(today.getMinutes()-today.getTimezoneOffset());
    var min=today.toISOString().slice(0,10);
    function cell(n,drive){ var km=(n*(drive?0.45:0.08)).toFixed(1).replace('.',',')+' km'; var t=n+' phút'+(drive?' lái xe':''); return '<span data-min="'+t+'" data-km="'+km+'">'+t+'</span>'; }
    function nl(a,drive){ return '<ul>'+a.map(function(r){return '<li>'+r[0]+cell(r[1],drive)+'</li>'}).join('')+'</ul>'; }
    var nearHtml='<section class="panel"><h2>Xung quanh <span class="seg" role="group" aria-label="Cách hiển thị khoảng cách"><button type="button" data-mode="min" aria-pressed="true">Phút</button><button type="button" data-mode="km" aria-pressed="false">Khoảng cách</button></span><span class="tag-soft">Theo tòa</span></h2>'+
      '<div class="near"><div><h3>Quanh nhà</h3>'+nl([['Bệnh viện đa khoa gần nhất',5+d.id%3],['Chợ dân sinh',3+d.id%4],['Cửa hàng tiện lợi',2+d.id%2]],false)+'</div>'+
      '<div><h3>Lân cận</h3>'+nl([['Trường đại học gần nhất',6+d.id%5],['Siêu thị',2+d.id%3],['Công viên',3+d.id%4],['Trạm xe buýt',2+d.id%2]],true)+'</div></div></section>';
    var floors=5+d.id%4, rentFrom=2;
    var bRows=[['Số tầng',floors+' tầng'],['Loại công trình','Chung cư mini'],['Tầng cho thuê',Array.apply(null,Array(floors-rentFrom)).map(function(_,i){return i+rentFrom}).join(',')],['Loại thang','Thang máy'],['Phòng cháy chữa cháy','Có'],['Chỗ để xe chung','Hầm và sân trước'],['Giờ ra vào','Tự do'],['Người duy trì',d.owner]];
    var bldgHtml='<section class="panel"><h2>Tổng quan tòa nhà <span class="tag-soft">Theo tòa</span></h2>'+dl(bRows)+'</section>';
    var sibs=[['Phòng 101','Studio, cửa sổ thoáng',d.price-300000,'Hết phòng',''],['Trục 02','Studio, cửa sổ thoáng',d.price+100000,'Hết phòng',''],['Trục 03','Căn giữa, cửa sổ view phố',d.price,d.left,'cur'],['Trục 04','Studio, cửa sổ thoáng',d.price+400000,'Hết phòng',''],['Trục 05','Mặt sau, cửa sổ view phố',d.price,'Còn 1','']];
    var sibHtml='<section class="panel"><h2>Các phòng trong tòa</h2><ul class="sib">'+sibs.map(function(r){
      var cls=r[3]==='Hết phòng'?'':r[3]==='Còn 1'?'ok':'warn';
      return '<li><span'+(r[4]?' class="cur"':'')+'>'+r[0]+'_'+r[1]+(r[4]?' · đang xem':'')+'</span><span><b>'+fmt(r[2])+'</b> <span class="st '+cls+'">'+r[3]+'</span></span></li>';
    }).join('')+'</ul></section>';
    $app.innerHTML=
    '<a class="back" href="#danh-sach">'+ICON.back+' Về kết quả</a>'+
    '<div class="gallery"><div class="ph">'+room(d,0)+'</div><div class="ph">'+room(d,1)+'</div><div class="ph">'+room(d,2)+'</div></div>'+
    '<div class="detail"><div>'+
      '<section class="panel"><div class="badges"><span class="tag soon">'+d.left+'</span>'+(d.flag==='new'?'<span class="tag">Hàng mới</span>':'')+'<span class="tag">'+d.district+'</span></div>'+
      '<h1>'+d.title+'</h1><p class="sub">Phòng riêng · '+d.type+' · Khép kín</p><p class="sub">Thuộc tòa '+d.bldg+' · người phụ trách '+d.owner+'</p>'+
      '<div class="meeting"><div><small>Điểm hẹn khách</small><b>'+d.addr+', '+d.district+'</b></div><span class="meta">Gặp tại cổng tòa nhà</span></div>'+
      '<p class="meta">Mã tin '+d.id+' · '+d.views+' lượt xem · cập nhật '+d.updated+'</p>'+
      '<div class="facts"><div>'+(d.old?'<s class="meta">'+fmt(d.old)+'</s>':'')+'<b style="color:var(--accent)">'+fmt(d.price)+'</b><span>mỗi tháng, chưa gồm dịch vụ</span></div><div><b>'+d.area+' m²</b><span>diện tích</span></div><div><b>'+d.people+' người</b><span>tối đa</span></div><div><b>'+d.left+'</b><span>tình trạng</span></div></div></section>'+
      '<section class="panel"><h2>Thông tin phòng</h2>'+dl(rows)+'</section>'+
      '<section class="panel"><h2>Có gì trong phòng</h2><div class="chips">'+d.items.map(function(i){return '<span>'+ICON.check+i+'</span>'}).join('')+'</div></section>'+
      '<section class="panel"><h2>Nội quy</h2>'+dl(rules)+'</section>'+
      '<section class="panel"><h2>Giá dịch vụ</h2>'+dl(svc)+'<p class="note" style="margin-top:12px">Phụ thu thêm đồ dùng: không.</p></section>'+nearHtml+bldgHtml+
    '</div>'+
    '<aside class="side"><section class="panel"><div>'+(d.old?'<s class="meta">'+fmt(d.old)+'</s>':'')+'</div><div class="price"><span class="big">'+fmt(d.price)+'</span>'+(off?'<span class="off">Giảm '+off+'%</span>':'')+'</div><span class="meta">/tháng</span>'+
      '<div class="actions"><button type="button" class="btn accent block" id="open-book">Đặt hẹn xem phòng</button>'+
      '<button type="button" class="btn ghost block" data-fav="'+d.id+'" id="d-fav" aria-pressed="'+isFav(d.id)+'">'+(isFav(d.id)?'Đã lưu vào yêu thích':'Lưu vào yêu thích')+'</button></div>'+
      '<div id="book-slot"></div>'+
      '<div class="contact"><div class="row"><span>Người phụ trách</span><b>'+d.owner+'</b></div><div class="row"><span>Điện thoại</span><b id="ph-num">'+d.phone+'</b><button type="button" class="copy" id="copy-ph">Sao chép</button></div></div></section>'+sibHtml+'</aside></div>';
    document.getElementById('open-book').onclick=function(){
      var slot=document.getElementById('book-slot');
      if(slot.innerHTML){ slot.innerHTML=''; return; }
      slot.innerHTML='<form class="book" id="book" novalidate><label for="b-name">Họ tên<input id="b-name" required autocomplete="name"></label><label for="b-phone">Số điện thoại<input id="b-phone" type="tel" required autocomplete="tel"></label><label for="b-date">Ngày muốn xem<input id="b-date" type="date" min="'+min+'" required></label><button class="btn block" type="submit">Gửi yêu cầu</button><p class="note" id="b-msg"></p></form>';
      document.getElementById('b-name').focus();
      document.getElementById('book').onsubmit=function(e){
        e.preventDefault();
        var n=document.getElementById('b-name').value.trim(), p=document.getElementById('b-phone').value.trim(), dt=document.getElementById('b-date').value;
        var msg=document.getElementById('b-msg');
        if(!n||!p||!dt){ msg.textContent='Nhập đủ họ tên, số điện thoại và ngày xem phòng.'; return; }
        document.getElementById('book-slot').innerHTML='<p class="ok">Đã ghi nhận lịch xem phòng ngày '+dt.split('-').reverse().join('/')+' cho '+n.replace(/</g,'&lt;')+'. Đây là trang mẫu nên yêu cầu chưa được gửi đến chủ phòng.</p>';
      };
    };
    var modeBtns=document.querySelectorAll('[data-mode]');
    modeBtns.forEach(function(b){ b.onclick=function(){
      var m=b.getAttribute('data-mode');
      modeBtns.forEach(function(x){ x.setAttribute('aria-pressed',x===b); });
      document.querySelectorAll('[data-min]').forEach(function(c){ c.textContent=m==='km'?c.getAttribute('data-km'):c.getAttribute('data-min'); });
    }; });
    document.getElementById('copy-ph').onclick=function(e){
      var t=document.getElementById('ph-num').textContent, b=e.currentTarget;
      function done(){ b.textContent='Đã chép'; setTimeout(function(){b.textContent='Sao chép'},1500); }
      try{ navigator.clipboard.writeText(t).then(done,function(){ var r=document.createRange(); r.selectNodeContents(document.getElementById('ph-num')); var s=getSelection(); s.removeAllRanges(); s.addRange(r); }); }catch(err){}
    };
  }

  /* ---------- events & routing ---------- */
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-fav]'); if(!b) return;
    var id=+b.getAttribute('data-fav'); toggleFav(id);
    var on=isFav(id); b.setAttribute('aria-pressed',on);
    if(b.id==='d-fav') b.textContent=on?'Đã lưu vào yêu thích':'Lưu vào yêu thích';
    if(st.favOnly&&window.__drawList&&document.getElementById('grid')) window.__drawList();
  });
  document.getElementById('nav-fav').onclick=function(){ st.favOnly=true; if(location.hash==='#danh-sach') list(); else location.hash='danh-sach'; };
  document.getElementById('nav-list').addEventListener('click',function(){ st.favOnly=false; });
  function route(){
    var h=location.hash.slice(1);
    window.__drawList=null;
    if(/^phong-\d+$/.test(h)) detail(+h.slice(6));
    else if(h==='danh-sach') list();
    else home();
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',route);
  updateCount(); route();
})();
</script>

</body></html>
